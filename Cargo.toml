[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/storage",
    "crates/events",
    "crates/core",
    "crates/capabilities",
    "crates/llm",
    "crates/mcp",
    "crates/agents",
    "crates/permissions",
    "crates/reversibility",
    "crates/chat",
    "crates/api",
    "crates/supervisor",
    "crates/markdown",
    "crates/brain",
    "crates/index",
    "crates/graph",
    "crates/fergentsd",
    "crates/fergents",
]

# The desktop app (`apps/desktop/src-tauri`) is a standalone Cargo workspace:
# its Tauri build script requires the staged `fergentsd` sidecar
# (`binaries/fergentsd-<target-triple>`), which is produced per build target.
# Keeping it out of this workspace keeps `cargo build/test/clippy/fmt` here
# hermetic and platform-independent.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
authors = ["Fergents contributors"]
repository = "https://github.com/fergents/fergents"
homepage = "https://github.com/fergents/fergents"
description = "Fergents: a local-first, agent-native workspace."

[workspace.dependencies]
# Internal crates
fergents-protocol = { path = "crates/protocol", version = "0.1.0" }
fergents-storage = { path = "crates/storage", version = "0.1.0" }
fergents-events = { path = "crates/events", version = "0.1.0" }
fergents-core = { path = "crates/core", version = "0.1.0" }
fergents-capabilities = { path = "crates/capabilities", version = "0.1.0" }
fergents-llm = { path = "crates/llm", version = "0.1.0" }
fergents-mcp = { path = "crates/mcp", version = "0.1.0" }
fergents-agents = { path = "crates/agents", version = "0.1.0" }
fergents-permissions = { path = "crates/permissions", version = "0.1.0" }
fergents-reversibility = { path = "crates/reversibility", version = "0.1.0" }
fergents-chat = { path = "crates/chat", version = "0.1.0" }
fergents-api = { path = "crates/api", version = "0.1.0" }
fergents-supervisor = { path = "crates/supervisor", version = "0.1.0" }
fergents-markdown = { path = "crates/markdown", version = "0.1.0" }
fergents-brain = { path = "crates/brain", version = "0.1.0" }
fergents-index = { path = "crates/index", version = "0.1.0" }
fergents-graph = { path = "crates/graph", version = "0.1.0" }

# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# Markdown parsing (CommonMark + GFM) — spec Dependencies
comrak = { version = "0.49", default-features = false }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"

# Tokenization for chunk sizing (cl100k_base, bundled vocab) — spec Chunking
tiktoken-rs = "0.11"

# HTTP client for the LLM provider adapters (`LLM.md` §2) — rustls so no system
# TLS is required across the CI matrix.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
bytes = "1"

# Local embeddings (BGE-M3) behind the `embed-real` feature — spec Dependencies.
# Feature-gated so the default build and CI only compile the deterministic stub
# and never fetch the ORT runtime or the model.
fastembed = { version = "6.1", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

# Embedded graph database (Datalog) — spec Dependencies / ADR-013.
# `storage-sled` (pure Rust) is used because Cozo's `storage-sqlite` links the
# native `sqlite3`, which conflicts with `rusqlite`'s bundled SQLite in this
# workspace (both declare `links = "sqlite3"`).
cozo = { version = "0.7", default-features = false, features = [
    "storage-sled",
    "graph-algo",
] }

# Entity extraction (URLs, emails, ...) — spec Dependencies (GRAPH.md §3.2)
regex = "1"

# Vault traversal and .brainignore (gitignore syntax) — spec Dependencies
walkdir = "2"
ignore = "0.4"

# Filesystem watcher — spec Dependencies (SEARCH.md §13.1)
notify = "8"

# `.fergbrain` archive (BRAIN.md §14) — spec Dependencies
zip = { version = "2", default-features = false, features = ["deflate"] }

# Identifiers, hashing, time
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# Local wall-clock formatting for daily notes and templates (`strftime`, D10)
chrono = "0.4"

# Errors
thiserror = "1"
anyhow = "1"

# Platform
libc = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Codegen (protocol contract)
typify = "0.2"

# Dev
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
