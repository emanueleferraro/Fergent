[package]
name = "fergents-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fergents kernel core: wiring, registries, and subsystems."

[dependencies]
fergents-storage = { workspace = true }
fergents-events = { workspace = true }
fergents-protocol = { workspace = true }
fergents-capabilities = { workspace = true }
fergents-llm = { workspace = true }
fergents-agents = { workspace = true }
fergents-brain = { workspace = true }
fergents-index = { workspace = true }
fergents-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
